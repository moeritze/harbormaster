version: "2"
linters:
  default: standard
  enable:
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G204 # subprocess launched with variable: harbormaster's whole job is running user commands; reviewed per call site
formatters:
  enable:
    - gofmt
    - goimports
